<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Hub - Enterprise Architecture</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        [x-cloak] { display: none !important; }
        iframe { transition: opacity 0.3s ease; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen overflow-hidden flex" x-data="dashboardApp()">

    <aside class="bg-slate-900 text-slate-300 w-72 flex-shrink-0 flex flex-col shadow-2xl z-20 transition-all duration-300 relative"
           :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full absolute h-full'">
        
        <div class="h-16 flex items-center px-6 border-b border-slate-800 bg-slate-950">
            <div class="flex items-center gap-3 text-white font-bold text-lg">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                </div>
                <span class="tracking-wide uppercase text-sm">Knowledge Hub</span>
            </div>
            <button @click="sidebarOpen = false" class="ml-auto md:hidden text-slate-400 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>

        <nav class="flex-1 py-6 overflow-y-auto scrollbar-hide px-4 space-y-6">
            
            <template x-for="(group, gIdx) in navigation" :key="gIdx">
                <div>
                    <p class="px-2 text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3 flex items-center gap-2">
                        <span x-html="group.iconSVG" class="w-4 h-4"></span>
                        <span x-text="group.category"></span>
                    </p>
                    
                    <div class="space-y-1">
                        <template x-for="item in group.items" :key="item.id">
                            <button @click="selectModule(item, group.category)" 
                                    class="w-full flex items-center px-3 py-2.5 rounded-xl transition-all duration-200 group/btn"
                                    :class="activeModule.id === item.id ? 'bg-indigo-600 text-white shadow-md' : 'hover:bg-slate-800 hover:text-white text-slate-400'">
                                <span class="text-lg mr-3 drop-shadow-sm group-hover/btn:scale-110 transition-transform" x-text="item.icon"></span>
                                <div class="flex-1 text-left">
                                    <p class="text-sm font-semibold truncate" x-text="item.title"></p>
                                </div>
                            </button>
                        </template>
                    </div>
                </div>
            </template>

        </nav>

        <div class="p-4 border-t border-slate-800 bg-slate-950/50">
            <div class="flex items-center">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center text-white shadow-inner">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                </div>
                <div class="ml-3 truncate">
                    <p class="text-sm font-semibold text-slate-200 truncate">Administrator</p>
                    <p class="text-xs text-slate-500 truncate">Enterprise Architecture</p>
                </div>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden bg-white relative">
        
        <header class="h-16 bg-white border-b border-slate-200 flex items-center px-4 md:px-8 shadow-sm shrink-0 justify-between">
            <div class="flex items-center text-sm text-slate-500">
                <button @click="sidebarOpen = !sidebarOpen" class="mr-4 p-2 bg-slate-100 rounded-lg hover:bg-slate-200 text-slate-600 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <span class="hidden md:inline font-medium" x-text="activeModule.category"></span>
                <svg class="w-4 h-4 mx-2 hidden md:inline text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                <span class="font-bold text-indigo-700 bg-indigo-50 px-3 py-1 rounded-full shadow-sm border border-indigo-100 flex items-center gap-2">
                    <span x-text="activeModule.icon"></span> <span x-text="activeModule.title"></span>
                </span>
            </div>
            
            <a :href="activeModule.url" target="_blank" class="flex items-center gap-2 text-xs font-bold text-slate-500 hover:text-indigo-600 transition bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-lg hover:bg-indigo-50">
                <span>Mở tab mới</span>
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
            </a>
        </header>

        <div class="flex-1 w-full h-full bg-slate-50 relative">
            <div x-show="isLoading" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-50 z-10">
                <div class="w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
                <p class="mt-4 text-sm font-bold text-slate-500 animate-pulse">Đang tải nội dung...</p>
            </div>

            <iframe :src="activeModule.url" 
                    @load="isLoading = false"
                    class="absolute inset-0 w-full h-full border-0"
                    title="Content View"
                    sandbox="allow-scripts allow-same-origin allow-popups">
            </iframe>
        </div>
    </main>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('dashboardApp', () => ({
                sidebarOpen: window.innerWidth > 768,
                isLoading: true,
                
                // Trạng thái module đang được chọn
                activeModule: {
                    id: 'ai-core-concepts',
                    title: 'AI Core Concepts',
                    url: 'modules/ai-core-concepts.html',
                    category: 'Artificial Intelligence',
                    icon: '🧠'
                },

                // Cấu trúc phân nhóm các bài học
                navigation: [
                    {
                        category: "Artificial Intelligence",
                        iconSVG: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>',
                        items: [
                            { id: 'ai-core-concepts', title: 'AI Core Concepts', url: 'modules/ai-core-concepts.html', icon: '🧠' },
                            { id: 'ai-vector', title: 'Vector Hóa trong AI', url: 'modules/ai-vector.html', icon: '📐' }
                        ]
                    },
                    {
                        category: "Database & Data Engineering",
                        iconSVG: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"/></svg>',
                        items: [
                            { id: 'data-modeling', title: 'Data Modeling (Star/Snowflake)', url: 'modules/data-modeling.html', icon: '📊' },
                            { id: 'db-normal', title: 'Database Normalization', url: 'modules/database-normalization.html', icon: '🗄️' },
                            { id: 'sql-index', title: 'SQL Indexing (B-Tree)', url: 'modules/sql-index.html', icon: '⚡' }
                        ]
                    },
                    {
                        category: "Data Governance",
                        iconSVG: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>',
                        items: [
                            { id: 'dmbok', title: 'DMBOK Framework', url: 'https://aihtn2708.github.io/DAMArecapbyaihtn/', icon: '🛡️' }
                        ]
                    }
                ],

                // Hàm chuyển đổi module
                selectModule(item, categoryName) {
                    // Nếu đang bấm vào module hiện tại thì không làm gì cả
                    if (this.activeModule.id === item.id) return;
                    
                    this.isLoading = true;
                    this.activeModule = {
                        ...item,
                        category: categoryName
                    };
                    
                    // Tự động đóng sidebar trên màn hình nhỏ khi chọn xong
                    if (window.innerWidth <= 768) {
                        this.sidebarOpen = false;
                    }
                }
            }));
        });
    </script>
</body>
</html>
