<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise AI Concepts Simulator</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUp 0.5s ease-out forwards;
        }

        .token-block {
            display: inline-block;
            transition: all 0.2s;
        }
        .token-block:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen overflow-y-auto">
    <div id="root"></div>

    <script type="text/babel">
        // Lấy các Hook từ đối tượng React toàn cục
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;

        // SỬA LỖI: Định nghĩa trực tiếp mã SVG của các Icon cần dùng (Tốc độ cao, không cần mạng)
        const Icon = ({ path, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{__html: path}} />
        );
        
        const BrainCircuit = (p) => <Icon path='<path d="M12 4.5a2.5 2.5 0 0 0-4.96-.46 2.5 2.5 0 0 0-1.98 3 2.5 2.5 0 0 0-1.32 4.24 3 3 0 0 0 .34 5.58 2.5 2.5 0 0 0 2.96 3.08 2.5 2.5 0 0 0 4.91.05L12 20V4.5Z"/><path d="M16 8V5c0-1.1.9-2 2-2"/><path d="M12 13h4"/><path d="M12 18h6a2 2 0 0 1 2 2v1"/><path d="M12 8h8"/><circle cx="16" cy="13" r="2"/><circle cx="18" cy="3" r="2"/><circle cx="20" cy="21" r="2"/><circle cx="20" cy="8" r="2"/>' {...p} />;
        const Database = (p) => <Icon path='<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/>' {...p} />;
        const Bot = (p) => <Icon path='<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>' {...p} />;
        const Sparkles = (p) => <Icon path='<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>' {...p} />;
        const Search = (p) => <Icon path='<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>' {...p} />;
        const Zap = (p) => <Icon path='<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>' {...p} />;
        const Calculator = (p) => <Icon path='<rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/>' {...p} />;
        const Layout = (p) => <Icon path='<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/>' {...p} />;
        const Layers = (p) => <Icon path='<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>' {...p} />;

        // ==========================================
        // 1. TOKEN & CONTEXT WINDOW SIMULATOR
        // ==========================================
        const TokenSimulator = () => {
            const [text, setText] = useState("Enterprise AI systems use Large Language Models (LLMs) to process vast amounts of unstructured data. Context limits are important!");
            const [limit, setLimit] = useState(25);

            const tokenize = (str) => {
                const words = str.split(/(\s+)/);
                let tokens = [];
                words.forEach(w => {
                    if (w.trim() === '') return;
                    if (w.length > 5) {
                        tokens.push(w.substring(0, 3));
                        tokens.push(w.substring(3));
                    } else {
                        tokens.push(w);
                    }
                });
                return tokens;
            };

            const tokens = tokenize(text);
            const isOverflow = tokens.length > limit;

            return (
                <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 animate-slide-up">
                    <div className="flex items-center gap-3 mb-4">
                        <div className="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-xl flex items-center justify-center">
                            <Layers className="w-6 h-6" />
                        </div>
                        <div>
                            <h3 className="text-xl font-bold text-slate-800">Tokens & Context Windows</h3>
                            <p className="text-sm text-slate-500">AI reads in "tokens" (chunks of text). The context window is its working memory.</p>
                        </div>
                    </div>

                    <div className="grid md:grid-cols-2 gap-8 mt-6">
                        <div className="space-y-4">
                            <label className="font-bold text-sm text-slate-700">Enter Input Text:</label>
                            <textarea 
                                value={text}
                                onChange={(e) => setText(e.target.value)}
                                className="w-full h-32 p-3 border border-slate-300 rounded-lg bg-slate-50 focus:ring-2 focus:ring-indigo-500 focus:outline-none resize-none"
                                placeholder="Type something..."
                            ></textarea>

                            <div className="space-y-2">
                                <div className="flex justify-between">
                                    <label className="font-bold text-sm text-slate-700">Context Window Limit (Tokens):</label>
                                    <span className="font-mono font-bold text-indigo-600">{limit}</span>
                                </div>
                                <input 
                                    type="range" min="5" max="50" value={limit} 
                                    onChange={(e) => setLimit(Number(e.target.value))}
                                    className="w-full accent-indigo-600"
                                />
                            </div>
                        </div>

                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col">
                            <div className="flex justify-between items-center mb-3 pb-2 border-b border-slate-200">
                                <span className="font-bold text-sm">Tokenized Representation</span>
                                <span className={`text-xs font-bold px-2 py-1 rounded-full ${isOverflow ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'}`}>
                                    {tokens.length} / {limit} Tokens
                                </span>
                            </div>
                            
                            <div className="flex flex-wrap gap-1 content-start flex-1 overflow-y-auto max-h-[160px]">
                                {tokens.map((token, idx) => {
                                    const isDropped = idx >= limit;
                                    const colors = ['bg-blue-100', 'bg-green-100', 'bg-yellow-100', 'bg-purple-100', 'bg-pink-100'];
                                    const color = isDropped ? 'bg-red-100 text-red-400 line-through' : colors[idx % colors.length];
                                    
                                    return (
                                        <span key={idx} className={`token-block px-1.5 py-0.5 rounded text-sm font-mono border border-white/50 ${color}`}>
                                            {token}
                                        </span>
                                    );
                                })}
                            </div>

                            {isOverflow && (
                                <div className="mt-4 p-2 bg-red-50 border border-red-200 rounded text-xs text-red-600 font-semibold flex items-center gap-2">
                                    ⚠️ Context Limit Exceeded! The AI will "forget" the red tokens.
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 2. RAG SIMULATOR
        // ==========================================
        const RagSimulator = () => {
            const [step, setStep] = useState(0);
            
            const runRagFlow = () => {
                setStep(0);
                setTimeout(() => setStep(1), 800);
                setTimeout(() => setStep(2), 2000);
                setTimeout(() => setStep(3), 3500);
            };

            return (
                <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 animate-slide-up">
                    <div className="flex items-center justify-between mb-6">
                        <div className="flex items-center gap-3">
                            <div className="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center">
                                <Database className="w-6 h-6" />
                            </div>
                            <div>
                                <h3 className="text-xl font-bold text-slate-800">RAG (Retrieval-Augmented Generation)</h3>
                                <p className="text-sm text-slate-500">Injecting private knowledge into the prompt before the AI answers.</p>
                            </div>
                        </div>
                        <button onClick={runRagFlow} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-bold flex items-center gap-2 transition shadow-sm">
                            <Zap className="w-4 h-4" /> Run Workflow
                        </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className={`p-4 rounded-xl border-2 transition-all duration-500 ${step >= 0 ? 'border-emerald-400 bg-emerald-50' : 'border-slate-200 bg-slate-50'}`}>
                            <h4 className="font-bold text-slate-700 flex items-center gap-2 mb-2"><Bot className="w-4 h-4"/> 1. User Query</h4>
                            <div className="bg-white p-3 rounded shadow-sm text-sm border border-slate-200">
                                "What is our company's refund policy for software products?"
                            </div>
                        </div>

                        <div className={`p-4 rounded-xl border-2 transition-all duration-500 ${step >= 1 ? 'border-blue-400 bg-blue-50' : 'border-slate-200 bg-slate-50'}`}>
                            <h4 className="font-bold text-slate-700 flex items-center gap-2 mb-2"><Search className="w-4 h-4"/> 2. Semantic Search</h4>
                            <div className="space-y-2 relative">
                                <div className={`p-2 rounded text-xs border ${step >= 2 ? 'bg-blue-600 text-white font-bold shadow-md transform scale-105 transition' : 'bg-white text-slate-500'}`}>
                                    Doc_301: "Software refunds are valid within 30 days of purchase..."
                                </div>
                                <div className="p-2 bg-white border border-slate-200 rounded text-xs text-slate-500 opacity-60">
                                    Doc_102: "Employee vacation days policy..."
                                </div>
                            </div>
                        </div>

                        <div className={`p-4 rounded-xl border-2 transition-all duration-500 ${step >= 3 ? 'border-purple-400 bg-purple-50' : 'border-slate-200 bg-slate-50'}`}>
                            <h4 className="font-bold text-slate-700 flex items-center gap-2 mb-2"><Sparkles className="w-4 h-4"/> 3. Augmented Prompt</h4>
                            <div className="bg-white p-3 rounded shadow-sm text-xs border border-slate-200 font-mono">
                                <span className="text-slate-400">System: Answer using only this context:</span><br/>
                                <span className="text-blue-600 font-bold bg-blue-50">"Software refunds are valid within 30 days..."</span><br/><br/>
                                <span className="text-slate-400">User: </span>
                                "What is the policy for software?"
                            </div>
                            {step >= 3 && (
                                <div className="mt-3 p-2 bg-purple-600 text-white rounded text-sm font-bold animate-pulse">
                                    AI: You can get a refund within 30 days.
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 3. AI AGENT SIMULATOR
        // ==========================================
        const AgentSimulator = () => {
            const [step, setStep] = useState(0);

            const runAgentFlow = () => {
                setStep(1); 
                setTimeout(() => setStep(2), 1500); 
                setTimeout(() => setStep(3), 3000); 
                setTimeout(() => setStep(4), 4500); 
            };

            return (
                <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 animate-slide-up">
                    <div className="flex items-center justify-between mb-6">
                        <div className="flex items-center gap-3">
                            <div className="w-12 h-12 bg-orange-100 text-orange-600 rounded-xl flex items-center justify-center">
                                <Bot className="w-6 h-6" />
                            </div>
                            <div>
                                <h3 className="text-xl font-bold text-slate-800">AI Agents & Tool Calling (ReAct)</h3>
                                <p className="text-sm text-slate-500">Agents loop through Reason -> Act -> Observe to achieve a goal autonomously.</p>
                            </div>
                        </div>
                        <button onClick={runAgentFlow} className="bg-orange-600 hover:bg-orange-700 text-white px-4 py-2 rounded-lg font-bold flex items-center gap-2 transition shadow-sm">
                            <Layout className="w-4 h-4" /> Trigger Agent
                        </button>
                    </div>

                    <div className="bg-slate-900 rounded-xl p-4 md:p-6 font-mono text-sm shadow-inner relative overflow-hidden text-slate-300">
                        <div className="text-slate-400 mb-4">
                            <span className="text-green-400 font-bold">Goal:</span> "What is 15% of the Q3 Revenue ($50,000)?"
                        </div>
                        
                        <div className="space-y-3">
                            <div className={`transition-opacity duration-500 ${step >= 1 ? 'opacity-100' : 'opacity-0'}`}>
                                <span className="text-purple-400 font-bold">Thought:</span> I need to calculate 15% of 50000. I am an AI and bad at math, I should use the calculator tool.
                            </div>
                            
                            <div className={`transition-opacity duration-500 ${step >= 2 ? 'opacity-100' : 'opacity-0'} flex items-center gap-2`}>
                                <span className="text-orange-400 font-bold">Action:</span> 
                                <span className="bg-slate-800 px-2 py-1 rounded text-orange-200 border border-slate-700 flex items-center gap-1">
                                    <Calculator className="w-3 h-3"/> call_calculator(expression="50000 * 0.15")
                                </span>
                            </div>

                            <div className={`transition-opacity duration-500 ${step >= 3 ? 'opacity-100' : 'opacity-0'}`}>
                                <span className="text-blue-400 font-bold">Observation:</span> 7500
                            </div>

                            <div className={`transition-opacity duration-500 ${step >= 4 ? 'opacity-100' : 'opacity-0'}`}>
                                <span className="text-purple-400 font-bold">Thought:</span> I now know the answer.
                                <div className="mt-2 text-white bg-green-900/50 p-3 rounded border border-green-500/50">
                                    <span className="text-green-400 font-bold">Final Answer:</span> 15% of the Q3 revenue is $7,500.
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // MAIN APPLICATION
        // ==========================================
        function AICoreConceptsApp() {
            const [activeTab, setActiveTab] = useState('tokens');

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 p-4 md:p-8">
                    <div className="max-w-5xl mx-auto mb-8 text-center space-y-4">
                        <h1 className="text-3xl md:text-5xl font-extrabold text-indigo-700 flex items-center justify-center gap-3">
                            <BrainCircuit className="w-10 h-10" />
                            AI Concepts Interactive Lab
                        </h1>
                        <p className="text-lg text-slate-600 max-w-2xl mx-auto">
                            Experience the core mechanisms powering Enterprise AI applications through visual simulators.
                        </p>
                    </div>

                    <div className="max-w-5xl mx-auto mb-8">
                        <div className="flex space-x-2 border-b-2 border-slate-200 overflow-x-auto scrollbar-hide pb-[-2px]">
                            <button 
                                onClick={() => setActiveTab('tokens')} 
                                className={`flex items-center gap-2 px-6 py-4 font-semibold whitespace-nowrap transition-all border-b-2 -mb-[2px] ${activeTab === 'tokens' ? 'border-indigo-600 text-indigo-700 bg-indigo-50/50 rounded-t-lg' : 'border-transparent text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-t-lg'}`}
                            >
                                <Layers className="w-5 h-5" /> Context & Tokens
                            </button>
                            <button 
                                onClick={() => setActiveTab('rag')} 
                                className={`flex items-center gap-2 px-6 py-4 font-semibold whitespace-nowrap transition-all border-b-2 -mb-[2px] ${activeTab === 'rag' ? 'border-emerald-600 text-emerald-700 bg-emerald-50/50 rounded-t-lg' : 'border-transparent text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-t-lg'}`}
                            >
                                <Database className="w-5 h-5" /> RAG Architecture
                            </button>
                            <button 
                                onClick={() => setActiveTab('agents')} 
                                className={`flex items-center gap-2 px-6 py-4 font-semibold whitespace-nowrap transition-all border-b-2 -mb-[2px] ${activeTab === 'agents' ? 'border-orange-600 text-orange-700 bg-orange-50/50 rounded-t-lg' : 'border-transparent text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-t-lg'}`}
                            >
                                <Bot className="w-5 h-5" /> AI Agents
                            </button>
                        </div>
                    </div>

                    <div className="max-w-5xl mx-auto min-h-[500px]">
                        {activeTab === 'tokens' && <TokenSimulator />}
                        {activeTab === 'rag' && <RagSimulator />}
                        {activeTab === 'agents' && <AgentSimulator />}
                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<AICoreConceptsApp />);
    </script>
</body>
</html>
